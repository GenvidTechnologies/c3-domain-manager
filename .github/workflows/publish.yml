name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  gate:
    uses: GenvidTechnologies/public-github-actions/.github/workflows/node-gate.yml@main
    with:
      # MUST match ci.yml's gate inputs. Recursive checkout inits the
      # construct3-sample submodule, which the `pretest` hook materializes into
      # the canonical test fixture. The shared gate checks out no submodules by
      # default, so without this the fixture is absent and `pretest` aborts
      # before a single test runs (#34).
      #
      # ci.yml got this in #41; publish.yml did not, and the gap stayed latent
      # until the v0.8.0 tag push — the first release cut after the submodule
      # existed, so it is also the first time this gate had a fixture to miss.
      # If you add an input to ci.yml's gate, add it here too.
      submodules: recursive

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public
